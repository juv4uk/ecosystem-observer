[package]
name = "ecosystem-observer-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone read-only Tauri shell for ecosystem-observer"
build = "build.rs"

[lib]
name = "ecosystem_observer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ecosystem-observer = { path = "../.." }
